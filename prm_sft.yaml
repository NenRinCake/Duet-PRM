### model
model_name_or_path: /path/to/Qwen2.5-Math-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /path/to/Duet-PRM/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset: factorized_prm
template: qwen
cutoff_len: 8192
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /path/to/output_dir
logging_steps: 25
save_steps: 100
save_strategy: steps
plot_loss: true
overwrite_output_dir: false
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: "steps"
eval_steps: 100
