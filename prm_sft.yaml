# prm_sft.yaml — LLaMA-Factory SFT 配置: 全参数训练因式分解生成式 PRM
# 用法: llamafactory-cli train prm_sft.yaml
# 默认适配 8 卡单节点训练；模型、数据和输出路径由 run_prm_sft.sh 传入。
#
# 相比1050题LoRA版本(rank32, target:all): 数据量×5, 继续沿用同样的rank/target,
# 因为LoRA容量瓶颈通常不会因为数据量增大而需要成倍放大——LoRA学的是"任务适配的
# 低秩变化", 不是像全参那样直接记忆全部数据, 数据量增大更多是提升泛化多样性,
# 不代表容量需求线性增长。如果这次loss收敛后依然远高于1050题版本, 才考虑加大rank。

