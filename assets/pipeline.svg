<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850" role="img" aria-labelledby="title desc">
  <title id="title">Duet-PRM data construction, training, and evaluation pipeline</title>
  <desc id="desc">Math problems are expanded into plans and executions, labeled for plan adherence and correctness, assembled into a dual-score dataset, used to train Duet-PRM, and evaluated with ranking and separation metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f78d8"/>
      <stop offset="1" stop-color="#7357bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#6b778c"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #172033; }
      .subtitle { font-size: 20px; fill: #526079; }
      .stage { font-size: 16px; font-weight: 750; letter-spacing: 1.3px; }
      .box-title { font-size: 23px; font-weight: 720; fill: #1e2a42; }
      .body { font-size: 17px; fill: #56647b; }
      .small { font-size: 15px; fill: #6b778c; }
      .chip { font-size: 15px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1800" height="850" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="900" y="60" text-anchor="middle" class="title">Duet-PRM Pipeline</text>
    <text x="900" y="94" text-anchor="middle" class="subtitle">From plan-conditioned trajectories to factorized reward modeling and inference-time selection</text>

    <!-- Phase bands -->
    <rect x="45" y="126" width="1160" height="485" rx="28" fill="#ffffff" stroke="#d5e1f5" stroke-width="2"/>
    <rect x="1230" y="126" width="525" height="485" rx="28" fill="#ffffff" stroke="#ddd4f0" stroke-width="2"/>
    <rect x="71" y="146" width="220" height="34" rx="17" fill="#e8f0ff"/>
    <text x="181" y="169" text-anchor="middle" class="stage" fill="#3269ba">DATA CONSTRUCTION</text>
    <rect x="1256" y="146" width="215" height="34" rx="17" fill="#f0eafd"/>
    <text x="1364" y="169" text-anchor="middle" class="stage" fill="#6f52b5">MODEL TRAINING</text>

    <!-- Step 1 -->
    <rect x="78" y="218" width="230" height="310" rx="22" fill="#f7faff" stroke="#afc8ef" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="115" cy="255" r="22" fill="#3f78d8"/>
    <text x="115" y="263" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">1</text>
    <text x="193" y="263" text-anchor="middle" class="box-title">Problems</text>
    <rect x="105" y="300" width="176" height="105" rx="14" fill="#ffffff" stroke="#d6e1f3"/>
    <path d="M133 326 H252 M133 347 H240 M133 368 H258" stroke="#8da6cc" stroke-width="6" stroke-linecap="round"/>
    <text x="193" y="441" text-anchor="middle" class="body">Math benchmark</text>
    <text x="193" y="466" text-anchor="middle" class="small">problem + reference answer</text>
    <rect x="116" y="489" width="154" height="26" rx="13" fill="#e7f0ff"/>
    <text x="193" y="507" text-anchor="middle" class="chip" fill="#3269ba">JSONL input</text>

    <!-- Arrow 1 -->
    <path d="M320 373 H365" stroke="#6b778c" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="380" y="218" width="300" height="310" rx="22" fill="#f9fbff" stroke="#afc8ef" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="417" cy="255" r="22" fill="#3f78d8"/>
    <text x="417" y="263" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">2</text>
    <text x="546" y="263" text-anchor="middle" class="box-title">Trajectory Sampling</text>
    <rect x="414" y="296" width="232" height="60" rx="14" fill="#e7f0ff"/>
    <text x="530" y="322" text-anchor="middle" class="label" font-size="18" font-weight="650" fill="#274b80">M candidate plans</text>
    <text x="530" y="344" text-anchor="middle" class="small">strategy-level diversity</text>
    <path d="M530 365 V394" stroke="#6b778c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="414" y="403" width="232" height="60" rx="14" fill="#f1ecff"/>
    <text x="530" y="429" text-anchor="middle" font-size="18" font-weight="650" fill="#61479f">N executions per plan</text>
    <text x="530" y="451" text-anchor="middle" class="small">step-level variation</text>
    <rect x="431" y="489" width="198" height="26" rx="13" fill="#eaf7f0"/>
    <text x="530" y="507" text-anchor="middle" class="chip" fill="#277d54">M × N trajectories</text>

    <!-- Arrow 2 -->
    <path d="M692 373 H737" stroke="#6b778c" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="752" y="218" width="420" height="310" rx="22" fill="#fbfcff" stroke="#afc8ef" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="789" cy="255" r="22" fill="#3f78d8"/>
    <text x="789" y="263" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">3</text>
    <text x="962" y="263" text-anchor="middle" class="box-title">Dual-Signal Labeling</text>
    <rect x="786" y="299" width="165" height="122" rx="16" fill="#eef5ff" stroke="#b8cff2"/>
    <circle cx="868" cy="332" r="18" fill="#367bd6"/>
    <path d="M859 332 L866 339 L879 324" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="868" y="374" text-anchor="middle" font-size="18" font-weight="680" fill="#244f8d">Plan adherence</text>
    <text x="868" y="400" text-anchor="middle" class="small">strategy fidelity</text>
    <rect x="973" y="299" width="165" height="122" rx="16" fill="#f2edff" stroke="#c9b9ee"/>
    <circle cx="1055" cy="332" r="18" fill="#7759c7"/>
    <path d="M1046 332 L1053 339 L1066 324" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1055" y="374" text-anchor="middle" font-size="18" font-weight="680" fill="#5e429c">Step correctness</text>
    <text x="1055" y="400" text-anchor="middle" class="small">rule-based evidence</text>
    <path d="M868 431 V466 H950" fill="none" stroke="#8090aa" stroke-width="3"/>
    <path d="M1055 431 V466 H974" fill="none" stroke="#8090aa" stroke-width="3"/>
    <rect x="854" y="454" width="216" height="61" rx="14" fill="#eaf7f0" stroke="#aed9c2"/>
    <text x="962" y="480" text-anchor="middle" font-size="17" font-weight="680" fill="#277d54">SFT examples</text>
    <text x="962" y="502" text-anchor="middle" class="small">plan score + step score</text>

    <!-- Arrow 3 -->
    <path d="M1184 373 H1278" stroke="#6b778c" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="1294" y="218" width="400" height="310" rx="22" fill="url(#model)" filter="url(#shadow)"/>
    <circle cx="1333" cy="255" r="22" fill="#ffffff" fill-opacity="0.22" stroke="#fff"/>
    <text x="1333" y="263" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">4</text>
    <text x="1494" y="264" text-anchor="middle" font-size="25" font-weight="740" fill="#fff">Train Duet-PRM</text>
    <rect x="1342" y="304" width="304" height="74" rx="17" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.35"/>
    <text x="1494" y="335" text-anchor="middle" font-size="18" font-weight="650" fill="#fff">Full-parameter SFT</text>
    <text x="1494" y="360" text-anchor="middle" font-size="16" fill="#e9ecff">LLaMA-Factory + DeepSpeed</text>
    <rect x="1342" y="400" width="304" height="83" rx="17" fill="#fff" fill-opacity="0.95"/>
    <text x="1494" y="430" text-anchor="middle" font-size="17" font-weight="680" fill="#3269ba">&lt;plan_score&gt; · &lt;step_score&gt;</text>
    <text x="1494" y="458" text-anchor="middle" class="small">0.0 · 0.5 · 1.0</text>
    <text x="1494" y="509" text-anchor="middle" font-size="16" fill="#eef1ff">Factorized process supervision</text>

    <!-- Down to evaluation -->
    <path d="M1494 542 V638 H900 V673" fill="none" stroke="#6b778c" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Evaluation band -->
    <rect x="180" y="680" width="1440" height="124" rx="24" fill="#ffffff" stroke="#cfe0d7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="205" y="701" width="155" height="30" rx="15" fill="#e5f5ec"/>
    <text x="283" y="722" text-anchor="middle" class="stage" fill="#277d54">EVALUATION</text>
    <text x="400" y="760" class="box-title">Candidate solutions</text>
    <path d="M602 752 H661" stroke="#6b778c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="680" y="716" width="245" height="68" rx="16" fill="#eef5ff"/>
    <text x="803" y="745" text-anchor="middle" font-size="18" font-weight="680" fill="#3269ba">Best-of-N Selection</text>
    <text x="803" y="769" text-anchor="middle" class="small">rank with dual scores</text>
    <rect x="948" y="716" width="245" height="68" rx="16" fill="#f2edff"/>
    <text x="1071" y="745" text-anchor="middle" font-size="18" font-weight="680" fill="#6547a7">Weighted Voting</text>
    <text x="1071" y="769" text-anchor="middle" class="small">aggregate answer groups</text>
    <rect x="1216" y="716" width="245" height="68" rx="16" fill="#eaf7f0"/>
    <text x="1339" y="745" text-anchor="middle" font-size="18" font-weight="680" fill="#277d54">Separation Analysis</text>
    <text x="1339" y="769" text-anchor="middle" class="small">AUC · Cohen's d</text>
  </g>
</svg>
